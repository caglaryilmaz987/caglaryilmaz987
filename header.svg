<svg fill="none" viewBox="0 0 800 220" width="100%" height="220" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes gradient {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }
        @keyframes pulse {
          0%, 100% { transform: scale(1); opacity: 0.9; }
          50% { transform: scale(1.03); opacity: 1; }
        }
        @keyframes float {
          0% { transform: translateY(0px); }
          50% { transform: translateY(-6px); }
          100% { transform: translateY(0px); }
        }
        @keyframes typing {
          0% { width: 0; }
          50% { width: 100%; }
          100% { width: 0; }
        }
        @keyframes blink {
          50% { border-color: transparent; }
        }

        .container {
          font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
          background: linear-gradient(-45deg, #0d1117, #161b22, #0d1117, #1f2937);
          background-size: 400% 400%;
          animation: gradient 12s ease infinite;
          border-radius: 16px;
          border: 1px solid rgba(255, 255, 255, 0.1);
          padding: 30px 40px;
          box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
          color: #f0f6fc;
          display: flex;
          flex-direction: column;
          justify-content: center;
          height: 160px;
          box-sizing: border-box;
          position: relative;
          overflow: hidden;
        }

        .glow {
          position: absolute;
          width: 250px;
          height: 250px;
          background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, rgba(139, 92, 246, 0.1) 50%, transparent 70%);
          top: -100px;
          right: -50px;
          border-radius: 50%;
          animation: float 6s ease-in-out infinite;
        }

        .glow-2 {
          position: absolute;
          width: 200px;
          height: 200px;
          background: radial-gradient(circle, rgba(236, 72, 153, 0.12) 0%, rgba(59, 130, 246, 0.08) 50%, transparent 70%);
          bottom: -80px;
          left: 10%;
          border-radius: 50%;
          animation: float 8s ease-in-out infinite reverse;
        }

        .badge {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          background: rgba(56, 189, 248, 0.1);
          border: 1px solid rgba(56, 189, 248, 0.3);
          color: #38bdf8;
          font-size: 12px;
          font-weight: 600;
          padding: 4px 12px;
          border-radius: 20px;
          margin-bottom: 12px;
          width: fit-content;
          letter-spacing: 0.5px;
          text-transform: uppercase;
        }

        .badge-dot {
          width: 8px;
          height: 8px;
          background-color: #38bdf8;
          border-radius: 50%;
          box-shadow: 0 0 8px #38bdf8;
          animation: pulse 2s infinite;
        }

        .title {
          font-size: 28px;
          font-weight: 800;
          margin: 0;
          background: linear-gradient(90deg, #ffffff 0%, #38bdf8 50%, #c084fc 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          letter-spacing: -0.5px;
        }

        .subtitle-box {
          display: inline-block;
          margin-top: 8px;
        }

        .subtitle {
          font-size: 15px;
          color: #94a3b8;
          font-weight: 500;
          margin: 0;
          white-space: nowrap;
          overflow: hidden;
          border-right: 2px solid #38bdf8;
          animation: typing 8s steps(55) infinite, blink 0.75s step-end infinite;
          letter-spacing: 0.2px;
        }

        .highlight {
          color: #c084fc;
          font-weight: 600;
        }
      </style>
      <div class="container">
        <div class="glow"></div>
        <div class="glow-2"></div>
        <div class="badge">
          <div class="badge-dot"></div>
          <span>AI &amp; Multi-Agent Systems Architect</span>
        </div>
        <h1 class="title">Sebahittin Çağlar Yılmaz</h1>
        <div class="subtitle-box">
          <p class="subtitle">Multi-Agentic RAG Platforms • LLM Engineering • Computer Vision Specialist</p>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
